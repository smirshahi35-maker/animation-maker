<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "AbarHigh";
          src: url("assets/fonts/AbarHigh-Regular.otf") format("opentype");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "AbarHigh", sans-serif;
          font-synthesis: none;
          color: #f2f5fb;
        }
        #s4-bg {
          position: absolute;
          inset: 0;
          background: #060a14;
        }
        #s4-glow {
          position: absolute;
          left: -300px;
          right: -300px;
          top: 160px;
          height: 1300px;
          background: radial-gradient(ellipse 45% 40% at 50% 45%, rgba(61, 111, 224, 0.42) 0%, rgba(61, 111, 224, 0.12) 45%, rgba(6, 10, 20, 0) 75%);
        }
        .ring {
          position: absolute;
          left: 50%;
          border-radius: 50%;
          border: 3px solid rgba(169, 195, 255, 0.28);
        }
        #s4-ring1 {
          width: 620px;
          height: 620px;
          margin-left: -310px;
          top: 450px;
          border-style: dashed;
        }
        #s4-ring2 {
          width: 860px;
          height: 860px;
          margin-left: -430px;
          top: 330px;
          border-color: rgba(169, 195, 255, 0.14);
        }
        .dot {
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #a9c3ff;
          box-shadow: 0 0 14px rgba(169, 195, 255, 0.9);
        }
        .fa {
          direction: rtl;
          unicode-bidi: isolate;
        }
        .w {
          display: inline-block;
        }
        .rule-label {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 22px;
          font-size: 40px;
          line-height: 1.3;
          color: #9aa6c2;
        }
        .rule-label i {
          display: block;
          width: 84px;
          height: 3px;
          background: #9aa6c2;
          opacity: 0.7;
        }
        /* Phase 1: logo + host line + free pill, centered */
        #s4-brand {
          position: absolute;
          left: 0;
          right: 0;
          top: 520px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 34px;
          transform-origin: 50% 0%;
        }
        #s4-logo {
          width: 380px;
          height: 380px;
          border-radius: 50%;
          box-shadow: 0 0 0 10px rgba(61, 111, 224, 0.35), 0 0 110px rgba(61, 111, 224, 0.7);
          display: block;
        }
        #s4-pill {
          padding: 18px 64px 26px;
          border-radius: 80px;
          background: linear-gradient(180deg, #5b86ee 0%, #3d6fe0 55%, #2b55c2 100%);
          box-shadow: 0 0 70px rgba(61, 111, 224, 0.65), inset 0 2px 0 rgba(255, 255, 255, 0.35);
          font-size: 84px;
          line-height: 1.3;
          color: #ffffff;
          position: relative;
          overflow: hidden;
        }
        #s4-shine {
          position: absolute;
          top: -20px;
          bottom: -20px;
          width: 120px;
          left: 0;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
          transform: skewX(-18deg);
        }
        /* Phase 2: title, host card, learning line */
        #s4-title {
          position: absolute;
          left: 90px;
          right: 90px;
          top: 300px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          text-align: center;
        }
        #s4-title-text {
          font-size: 104px;
          line-height: 1.3;
          white-space: nowrap;
          filter: drop-shadow(0 0 26px rgba(120, 160, 255, 0.4));
        }
        #s4-title-text .w {
          background: linear-gradient(180deg, #ffffff 22%, #c9d7f5 60%, #8fa6d6 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          padding: 0 6px;
        }
        #s4-card {
          position: absolute;
          left: 270px;
          top: 570px;
          width: 540px;
          height: 572px;
          border-radius: 36px;
          overflow: hidden;
          border: 4px solid rgba(169, 195, 255, 0.7);
          box-shadow: 0 0 90px rgba(61, 111, 224, 0.55), 0 40px 80px rgba(0, 0, 0, 0.6);
          background: #dfe4ec;
        }
        #s4-card img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 50% 20%;
          transform-origin: 50% 30%;
        }
        #s4-card-fade {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 260px;
          background: linear-gradient(180deg, rgba(6, 10, 20, 0) 0%, rgba(6, 10, 20, 0.85) 100%);
        }
        #s4-name {
          position: absolute;
          left: 150px;
          right: 150px;
          top: 1080px;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 18px 30px 26px;
          border-radius: 30px;
          background: rgba(10, 16, 34, 0.92);
          border: 3px solid rgba(61, 111, 224, 0.75);
          box-shadow: 0 0 50px rgba(61, 111, 224, 0.35);
        }
        #s4-name-role {
          font-size: 38px;
          line-height: 1.3;
          color: #a9c3ff;
        }
        #s4-name-text {
          font-size: 66px;
          line-height: 1.3;
          color: #ffffff;
        }
        #s4-learn {
          position: absolute;
          left: 90px;
          right: 90px;
          top: 1330px;
          text-align: center;
          font-size: 62px;
          line-height: 1.4;
          color: #f2f5fb;
        }
        #s4-learn .hl {
          color: #8fb0ff;
          text-shadow: 0 0 26px rgba(61, 111, 224, 0.8);
        }
        #s4-flash {
          position: absolute;
          inset: 0;
          background: #ffffff;
        }
      </style>

      <div id="root" data-composition-id="s4-reveal" data-width="1080" data-height="1920">
        <div id="s4-bg" class="clip" data-start="0" data-duration="10.5" data-track-index="0"></div>
        <div id="s4-glow" data-layout-ignore></div>
        <div class="ring" id="s4-ring1"></div>
        <div class="ring" id="s4-ring2"></div>
        <div id="s4-dots"></div>

        <div id="s4-brand" class="fa">
          <img id="s4-logo" src="assets/brand/logo-circle.png" alt="Argon Medical" />
          <div class="rule-label" id="s4-presents"><i></i><span>برگزار می‌کند</span><i></i></div>
          <div id="s4-pill"><span>وبینار رایگان</span><div id="s4-shine"></div></div>
        </div>

        <div id="s4-title" class="fa">
          <div class="rule-label" id="s4-title-label"><i></i><span>وبینار</span><i></i></div>
          <div id="s4-title-text"><span class="w">مدیریت</span> <span class="w">نوین</span> <span class="w">کلینیک</span></div>
        </div>

        <div id="s4-card">
          <img id="s4-host" src="assets/brand/host-crop.png" alt="" />
          <div id="s4-card-fade"></div>
        </div>
        <div id="s4-name" class="fa">
          <div id="s4-name-role">سخنران</div>
          <div id="s4-name-text">مهندس حسام هاشمی</div>
        </div>

        <div id="s4-learn" class="fa"><span class="w">یاد</span> <span class="w">بگیر</span> <span class="w">چطور</span> <span class="w hl">مراجعه‌کننده</span> <span class="w hl">جذب</span> <span class="w">کنی</span></div>

        <div id="s4-flash"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Drifting particles: index-derived positions (deterministic)
          const dots = document.getElementById("s4-dots");
          for (let i = 0; i < 18; i++) {
            const d = document.createElement("div");
            d.className = "dot";
            d.id = "s4-dot-" + i;
            const x = 60 + ((i * 397) % 960);
            const y = 300 + ((i * 653) % 1250);
            d.style.left = x + "px";
            d.style.top = y + "px";
            d.style.opacity = String(0.25 + ((i * 37) % 50) / 100);
            dots.appendChild(d);
            tl.fromTo(d, { y: 0 }, { y: -(140 + ((i * 53) % 160)), duration: 10.5, ease: "none" }, 0);
          }

          // Ambient rings + glow
          tl.fromTo("#s4-ring1", { rotation: 0 }, { rotation: 40, duration: 10.5, ease: "none" }, 0);
          tl.fromTo("#s4-ring2", { rotation: 0, scale: 0.94 }, { rotation: -25, scale: 1.04, duration: 10.5, ease: "sine.inOut" }, 0);
          tl.fromTo("#s4-glow", { opacity: 0.6, scale: 0.85 }, { opacity: 1, scale: 1.05, duration: 2.2, ease: "power2.out" }, 0);

          // Cut-in flash from the previous scene
          tl.fromTo("#s4-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0);

          // Phase 1 — logo blooms (spring-pop-entrance), presents line, free pill slams on "رایگان"
          tl.fromTo("#s4-logo", { scale: 0.3, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" }, 0.02);
          tl.fromTo("#s4-presents", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.5);
          tl.fromTo("#s4-pill", { opacity: 0, scale: 1.5, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 1.59);
          tl.fromTo("#s4-shine", { x: -160 }, { x: 640, duration: 0.8, ease: "power2.inOut" }, 2.14);

          // Phase 2 — brand clears, title lands on "مدیریت نوین کلینیک"
          tl.to("#s4-brand", { opacity: 0, scale: 0.6, y: -260, duration: 0.5, ease: "power3.in" }, 3.1);
          tl.to(["#s4-ring1", "#s4-ring2"], { opacity: 0.45, duration: 0.6, ease: "power2.out" }, 3.25);
          tl.fromTo("#s4-title", { y: 430 }, { y: 0, duration: 0.8, ease: "power3.inOut" }, 4.89);
          tl.fromTo("#s4-title-label", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.35);
          tl.fromTo(
            "#s4-title-text .w",
            { opacity: 0, y: 80, filter: "blur(10px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", stagger: 0.38 },
            3.37,
          );

          // Host card rises on "با مهندس حسام هاشمی" (camera push inside the card)
          tl.fromTo("#s4-card", { opacity: 0, y: 220, rotationX: 18, transformPerspective: 1200 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.8, ease: "expo.out" }, 5.29);
          tl.fromTo("#s4-host", { scale: 1.0 }, { scale: 1.1, duration: 5.2, ease: "sine.inOut" }, 5.29);
          tl.fromTo("#s4-name", { opacity: 0, y: 60, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 5.74);

          // Learning line, word by word (waterfall-entry)
          tl.fromTo("#s4-learn .w", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.24 }, 7.13);
          tl.fromTo("#s4-learn .hl", { textShadow: "0 0 0px rgba(61,111,224,0)" }, { textShadow: "0 0 34px rgba(61,111,224,1)", duration: 0.5, ease: "power2.out", immediateRender: false }, 8.39);

          window.__timelines["s4-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
