<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "AbarHigh";
          src: url("assets/fonts/AbarHigh-Regular.otf") format("opentype");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "AbarHigh", sans-serif;
          font-synthesis: none;
          color: #f2f5fb;
        }
        #s6-bg {
          position: absolute;
          inset: 0;
          background: #060a14;
        }
        /* Same framing as the end of scene 1 (scale 1.09, y -24) so the room matches */
        .s6-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 62%;
        }
        .s6-cam img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s6-full {
          clip-path: inset(0 0 0 100%);
        }
        #s6-glare {
          position: absolute;
          top: -100px;
          bottom: -100px;
          width: 160px;
          left: 0;
          margin-left: -80px;
          background: linear-gradient(90deg, rgba(255, 236, 200, 0) 0%, rgba(255, 236, 200, 0.75) 50%, rgba(255, 236, 200, 0) 100%);
          filter: blur(6px);
        }
        #s6-grade {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 80% 55% at 50% 62%, rgba(6, 10, 20, 0) 0%, rgba(6, 10, 20, 0.4) 100%),
            linear-gradient(180deg, rgba(6, 10, 20, 0.92) 0%, rgba(6, 10, 20, 0.6) 24%, rgba(6, 10, 20, 0) 46%, rgba(6, 10, 20, 0.25) 80%, rgba(6, 10, 20, 0.8) 100%);
        }
        .fa {
          direction: rtl;
          unicode-bidi: isolate;
        }
        .w {
          display: inline-block;
        }
        #s6-head {
          position: absolute;
          top: 220px;
          left: 108px;
          right: 108px;
          text-align: center;
          font-size: 118px;
          line-height: 1.3;
          filter: drop-shadow(0 0 26px rgba(120, 160, 255, 0.4));
        }
        #s6-head .w {
          background: linear-gradient(180deg, #ffffff 22%, #c9d7f5 60%, #8fa6d6 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          padding: 0 6px;
        }
        #s6-notes {
          position: absolute;
          top: 420px;
          right: 120px;
          left: 120px;
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 18px;
        }
        .note {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 16px 30px;
          border-radius: 28px;
          background: rgba(10, 16, 34, 0.86);
          border: 3px solid rgba(61, 111, 224, 0.7);
          box-shadow: 0 0 40px rgba(61, 111, 224, 0.35);
          font-size: 42px;
          line-height: 1.35;
          white-space: nowrap;
        }
        .note .ok {
          width: 50px;
          height: 50px;
          border-radius: 50%;
          background: #3d6fe0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .note .ok svg {
          width: 30px;
          height: 30px;
          display: block;
        }
        .note .tm {
          color: #a9c3ff;
          direction: ltr;
          font-size: 40px;
        }
        #s6-counter {
          position: absolute;
          left: 0;
          right: 0;
          top: 1215px;
          display: flex;
          justify-content: center;
        }
        #s6-chip {
          display: flex;
          align-items: center;
          gap: 34px;
          padding: 22px 48px;
          border-radius: 36px;
          background: rgba(6, 10, 20, 0.72);
          border: 3px solid rgba(61, 111, 224, 0.8);
          box-shadow: 0 0 80px rgba(61, 111, 224, 0.45);
        }
        #s6-chip-label {
          font-size: 46px;
          line-height: 1.3;
        }
        #s6-num {
          direction: ltr;
          width: 170px;
          height: 170px;
          line-height: 170px;
          text-align: center;
          font-size: 150px;
          color: #8fb0ff;
          text-shadow: 0 0 34px rgba(61, 111, 224, 0.95);
          position: relative;
          top: 23px;
        }
      </style>

      <div id="root" data-composition-id="s6-full" data-width="1080" data-height="1920">
        <div id="s6-bg" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
        <div class="s6-cam" id="s6-empty"><img src="assets/ai/waiting-empty.png" alt="" /></div>
        <div class="s6-cam" id="s6-full"><img src="assets/ai/waiting-full.png" alt="" /></div>
        <div id="s6-glare"></div>
        <div id="s6-grade"></div>

        <div id="s6-head" class="fa"><span class="w">حالا</span> <span class="w">نوبت</span> <span class="w">توئه</span></div>

        <div id="s6-notes" class="fa">
          <div class="note" id="s6-n1"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></div><span>نوبت جدید ثبت شد</span><span class="tm">۱۰:۳۰</span></div>
          <div class="note" id="s6-n2"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></div><span>نوبت جدید ثبت شد</span><span class="tm">۱۱:۱۵</span></div>
          <div class="note" id="s6-n3"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></div><span>نوبت جدید ثبت شد</span><span class="tm">۱۲:۰۰</span></div>
        </div>

        <div id="s6-counter">
          <div id="s6-chip" class="fa">
            <div id="s6-chip-label">نوبت‌های امروز</div>
            <div id="s6-num">۰</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";
          const fa = (n) => String(Math.round(n)).replace(/\d/g, (d) => FA[d]);

          // Both plates share one camera move, continuing the scene-1 push
          tl.fromTo([".s6-cam"], { scale: 1.09, y: -24 }, { scale: 1.14, y: -40, duration: 3, ease: "sine.out" }, 0);

          // Light sweep wipes empty → full, right to left
          const wipe = { p: 0 };
          const full = document.getElementById("s6-full");
          const glare = document.getElementById("s6-glare");
          const applyWipe = () => {
            full.style.clipPath = "inset(0 0 0 " + (100 - wipe.p) + "%)";
            glare.style.left = (1080 * (100 - wipe.p)) / 100 + "px";
            glare.style.opacity = String(wipe.p > 0 && wipe.p < 100 ? 1 : 0);
          };
          applyWipe();
          tl.to(wipe, { p: 100, duration: 0.9, ease: "power2.inOut", onUpdate: applyWipe }, 0.1);

          // Headline on "حالا نوبت توئه"
          tl.fromTo("#s6-head .w", { opacity: 0, y: 60, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.22 }, 0.05);

          // Booking notifications pop (spring-pop-entrance)
          tl.fromTo(["#s6-n1", "#s6-n2", "#s6-n3"], { opacity: 0, scale: 0.6, x: 80 }, { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: "back.out(2)", stagger: 0.5 }, 0.6);

          // Counter climbs 0 → 24
          tl.fromTo("#s6-chip", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.2);
          const c = { v: 0 };
          const num = document.getElementById("s6-num");
          tl.to(c, { v: 24, duration: 1.7, ease: "power2.out", onUpdate: () => (num.textContent = fa(c.v)) }, 0.6);
          tl.fromTo("#s6-num", { scale: 0.8 }, { scale: 1.05, duration: 1.7, ease: "power2.out" }, 0.6);

          window.__timelines["s6-full"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
