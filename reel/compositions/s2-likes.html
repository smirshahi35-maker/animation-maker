<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "AbarHigh";
          src: url("assets/fonts/AbarHigh-Regular.otf") format("opentype");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "AbarHigh", sans-serif;
          font-synthesis: none;
          color: #f2f5fb;
        }
        #s2-bg {
          position: absolute;
          inset: 0;
          background: #060a14;
        }
        #s2-cam {
          position: absolute;
          inset: 0;
          transform-origin: 48% 45%;
        }
        #s2-cam img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s2-grade {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 70% 40% at 50% 46%, rgba(6, 10, 20, 0) 0%, rgba(6, 10, 20, 0.5) 100%),
            linear-gradient(180deg, rgba(6, 10, 20, 0.95) 0%, rgba(6, 10, 20, 0.78) 30%, rgba(6, 10, 20, 0.1) 48%, rgba(6, 10, 20, 0.45) 64%, rgba(6, 10, 20, 0.92) 82%, rgba(6, 10, 20, 0.96) 100%);
        }
        .fa {
          direction: rtl;
          unicode-bidi: isolate;
        }
        .w {
          display: inline-block;
        }
        #s2-stats {
          position: absolute;
          top: 210px;
          left: 108px;
          right: 108px;
          display: flex;
          flex-direction: column;
          gap: 26px;
        }
        .stat {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 150px;
          padding: 0 46px;
          border-radius: 30px;
          background: rgba(14, 22, 44, 0.72);
          border: 3px solid rgba(61, 111, 224, 0.5);
          box-shadow: 0 0 50px rgba(61, 111, 224, 0.18);
        }
        .stat-name {
          display: flex;
          align-items: center;
          gap: 24px;
          font-size: 54px;
          line-height: 1.3;
        }
        .stat-name svg {
          width: 58px;
          height: 58px;
          display: block;
        }
        .stat-num {
          direction: ltr;
          font-size: 96px;
          line-height: 150px;
          height: 150px;
          position: relative;
          top: 14px;
          color: #ffffff;
          text-shadow: 0 0 30px rgba(120, 160, 255, 0.55);
        }
        #s2-punch {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 1270px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #s2-l1 {
          font-size: 118px;
          line-height: 1.3;
          color: #f2f5fb;
          text-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
        }
        #s2-l2 {
          font-size: 138px;
          line-height: 1.25;
          filter: drop-shadow(0 0 34px rgba(255, 74, 61, 0.6));
        }
        #s2-l2 .w {
          background: linear-gradient(180deg, #ffb27a 20%, #ff4a3d 60%, #d0202c 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          padding: 0 6px;
        }
      </style>

      <div id="root" data-composition-id="s2-likes" data-width="1080" data-height="1920">
        <div id="s2-bg" class="clip" data-start="0" data-duration="5.2" data-track-index="0"></div>
        <div id="s2-cam">
          <img src="assets/ai/doctor-night.png" alt="" />
        </div>
        <div id="s2-grade"></div>

        <div id="s2-stats" class="fa">
          <div class="stat" id="s2-row1">
            <div class="stat-name">
              <svg viewBox="0 0 24 24" fill="none" stroke="#a9c3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5" /><circle cx="17" cy="9" r="2.6" /><path d="M16.5 14.6c2.4.2 4.2 1.8 5 4.9" /></svg>
              <span>فالوور</span>
            </div>
            <div class="stat-num" id="s2-n1">۰</div>
          </div>
          <div class="stat" id="s2-row2">
            <div class="stat-name">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z" /></svg>
              <span>لایک</span>
            </div>
            <div class="stat-num" id="s2-n2">۰</div>
          </div>
        </div>

        <div id="s2-punch" class="fa">
          <div id="s2-l1"><span class="w">پیام</span> <span class="w">داری.</span></div>
          <div id="s2-l2"><span class="w">نوبت</span> <span class="w">نداری.</span></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";
          const fa = (n) =>
            String(Math.round(n))
              .replace(/\B(?=(\d{3})+(?!\d))/g, "٬")
              .replace(/\d/g, (d) => FA[d]);

          // Slow push toward her face
          tl.fromTo("#s2-cam", { scale: 1.0 }, { scale: 1.13, duration: 5.2, ease: "sine.inOut" }, 0);

          // Rows enter on "فالوور داری" / "لایک داری"
          tl.fromTo("#s2-row1", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.05);
          tl.fromTo("#s2-row2", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 1.15);

          // Counters climb (counting-dynamic-scale)
          const c1 = { v: 0 };
          const c2 = { v: 0 };
          const n1 = document.getElementById("s2-n1");
          const n2 = document.getElementById("s2-n2");
          tl.to(c1, { v: 12800, duration: 1.8, ease: "power2.out", onUpdate: () => (n1.textContent = fa(c1.v)) }, 0.15);
          tl.fromTo("#s2-n1", { scale: 0.86 }, { scale: 1, duration: 1.8, ease: "power2.out" }, 0.15);
          tl.to(c2, { v: 4320, duration: 1.6, ease: "power2.out", onUpdate: () => (n2.textContent = fa(c2.v)) }, 1.25);
          tl.fromTo("#s2-n2", { scale: 0.86 }, { scale: 1, duration: 1.6, ease: "power2.out" }, 1.25);

          // "ولی..." — stats step back
          tl.to("#s2-stats", { opacity: 0.45, scale: 0.96, duration: 0.5, ease: "power2.inOut" }, 2.2);

          // Punch lines (kinetic-beat-slam: distinct entrances)
          tl.fromTo("#s2-l1 .w", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.2 }, 2.45);
          tl.fromTo(
            "#s2-l2 .w",
            { opacity: 0, scale: 1.5, filter: "blur(18px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.3 },
            3.5,
          );
          tl.fromTo("#s2-l2", { x: 0 }, { x: 14, duration: 0.06, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, 3.62);

          window.__timelines["s2-likes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
