        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s2"]');
          const q = (s) => root.querySelectorAll(s);
          const en = (n) => Math.round(n).toLocaleString("en-US");

          // Word reveals land on the spoken English word (scene-local times from TIMING.md)

          ["#s2-h1", "#s2-h2", "#s2-h3"].forEach((h, i) => {
            tl.fromTo(h, { opacity: 0, y: 0, x: 0, scale: 0.6 },
              { keyframes: [{ opacity: 1, scale: 1, duration: 0.15 }, { y: -330, x: -30 * (i + 1), opacity: 0, duration: 0.85, ease: "power1.out" }] }, 0.45 + i * 0.22);
          });
          out("#s2-t1", 1.3); // "views," is up from 0.94; gone as "80K" rises on "but" (1.62)

          // 2) "but your DMs": swipe inside the phone to the empty inbox; camera pushes in
          tl.to("#s2-reel", { x: -488, duration: 0.45, ease: "power3.inOut" }, 1.4);
          tl.fromTo("#s2-dm", { x: 488 }, { x: 0, duration: 0.45, ease: "power3.inOut" }, 1.4);
          tl.to("#s2-phonewrap", { scale: 1.12, y: 100, duration: 1.0, ease: "power2.inOut" }, 1.48);
          out("#s2-t2", 3.0); // "empty?" ends 2.90, gone before "One" (3.42)

          // 3) Pull back + arc: the client's reel, the 80,000 stat
          tl.to("#s2-dm", { x: 488, duration: 0.45, ease: "power3.inOut" }, 3.12);
          tl.to("#s2-reel", { x: 0, duration: 0.45, ease: "power3.inOut" }, 3.12);
          tl.to("#s2-phonewrap", { scale: 0.62, y: 60, rotationY: -24, rotationZ: -3, transformPerspective: 1600, duration: 1.06, ease: "power3.inOut" }, 3.06);
          // the reel stays the hero until the chip ("trending", 4.56) and the counter take the space above it
          tl.to("#s2-phonewrap", { scale: 0.5, y: 150, duration: 0.44, ease: "power2.inOut" }, 4.12);
          tl.fromTo("#s2-chipwrap", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 4.56);
          q(".eq i").forEach((b, i) => {
            tl.fromTo(b, { scaleY: 0.3 }, { scaleY: 1, duration: 0.18 + i * 0.03, ease: "sine.inOut", yoyo: true, repeat: 15 }, 4.64 + i * 0.05);
          });
          // "eighty thousand": the counter runs from "eighty" (5.92) and is settled by the end of "thousand" (6.74)
          tl.fromTo("#s2-stat", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.86);
          tl.fromTo("#s2-num", { scale: 0.9, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.86);
          const stat = { v: 0 };
          tl.fromTo(stat, { v: 0 }, { v: 80000, duration: 1.0, ease: "power3.out", immediateRender: false,
            onUpdate: () => { document.getElementById("s2-num").textContent = en(Math.round(stat.v / 100) * 100); } }, 5.9);

          // 4) "but not": dolly down, views leave the top, the lonely zero rises (readable by "single order.")
          tl.to("#s2-world", { y: -1500, duration: 0.95, ease: "power3.inOut" }, 7.55);
          // Phone rides the dolly with the stack (no extra upward parallax: from y:150 it would overprint the chip); fade only its last sliver
          tl.to("#s2-phonewrap", { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.2);
          tl.fromTo("#s2-zero", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 7.75);
          tl.fromTo("#s2-zero .ln", { scale: 0.88 }, { scale: 1.03, duration: 1.1, ease: "power2.out" }, 7.9); // still moving when the 8.88 tilt takes over

          // 5) "Because": one camera tilt, the zero and the Veo card travel together (never semi-transparent over each other)
          // 1400 = card parked fully below frame (top 600+1400 = 2000, shadow ~1940) and the zero fully above it at the end
          tl.to("#s2-zero", { y: -1400, duration: 0.66, ease: "power3.inOut" }, 8.88); // clears the t4 band before "BECAUSE" fades in (9.28)
          tl.set("#s2-card", { opacity: 1 }, 8.88);
          tl.fromTo("#s2-card", { y: 1400, scale: 1 }, { y: 0, duration: 0.66, ease: "power3.inOut" }, 8.88);
          tl.fromTo("#s2-card video", { scale: 1 }, { scale: 1.06, duration: 2.0, ease: "none" }, 8.98);

          // 6) Lights down before "but" (11.08) so the white words land on dark; the trust ring barely moves
          tl.to("#s2-card", { y: -1650, scale: 0.92, rotation: -2, filter: "blur(6px)", duration: 0.32, ease: "power3.in" }, 10.74); // off the top by 11.06
          out("#s2-t4", 10.88, 0.2); // the thrown card wipes over it, gone by 11.08 ("but")
          tl.set("#s2-card", { autoAlpha: 0 }, 11.07);
          tl.to("#s2-dim", { opacity: 1, duration: 0.35, ease: "power1.in" }, 10.72); // fully dark by 11.07, when white "BUT" lands
          tl.fromTo("#s2-ring", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 12.0); // on "trust."
          const arcLen = 1539.4, pct = { v: 0 };
          tl.fromTo(pct, { v: 0 }, { immediateRender: false, keyframes: [{ v: 3, duration: 0.42, ease: "power2.out" }, { v: 5, duration: 0.14, ease: "sine.out" }, { v: 3, duration: 0.18, ease: "sine.inOut" }],
