                    <svg viewBox="0 0 24 24"><path fill="#ffd60a" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s3"]');
          const q = (s) => root.querySelectorAll(s);

          // Word reveals on the English narration (data-t = scene-local start of the spoken word)
          q(".w[data-t]").forEach((el) => {
            tl.fromTo(el, { opacity: 0, y: 30, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, +el.dataset.t);
          });

          // "HERE’S THE TIP:" emerges from the ring's darkness, then rises after "tip." to become the header
          tl.fromTo("#s3-hero", { scale: 1.35 }, { scale: 1, duration: 0.68, ease: "expo.out" }, 0.05);
          tl.to("#s3-hero", { y: -660, scale: 0.34, opacity: 0.65, duration: 0.6, ease: "power3.out" }, 0.82);

          // Two phones rise in on "Content"; camera leans toward the side being described
          tl.fromTo(["#s3-pL", "#s3-pR"], { y: 360, opacity: 0, filter: "blur(12px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out", stagger: 0.08 }, 1.02);
          tl.fromTo("#s3-div", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out" }, 2.97);
          tl.fromTo("#s3-cols", { x: 0, scale: 1, transformOrigin: "540px 900px" },
            { x: 46, scale: 1.015, duration: 2.68, ease: "sine.inOut" }, 1.07);
          tl.to("#s3-cols", { x: -46, duration: 2.9, ease: "sine.inOut" }, 3.77);

          // LEFT: the busy trend edit: punch-ins on the music beat, shake, stickers, glitches
          const beat = 60 / 112;
          for (let k = 0; k < 10; k++) {
            const t = 1.16 + k * beat;
            tl.fromTo("#s3-busyfx", { scale: 1 },
              { keyframes: [{ scale: k % 2 ? 1.1 : 1.16, rotation: k % 2 ? -1.2 : 1.2, duration: 0.06, ease: "power2.out" },
                            { scale: 1, rotation: 0, duration: 0.34, ease: "power2.out" }], immediateRender: k === 0 }, t);
          }
          // stickers pop through "...gets views is about the trend."
          [["#s3-k1", 1.45, -8], ["#s3-k2", 2.16, 8], ["#s3-k3", 2.72, -10], ["#s3-k4", 3.12, 7], ["#s3-k5", 3.56, -6]].forEach(([s, t, r]) => {
            tl.fromTo(s, { opacity: 0, scale: 0.3, rotation: r * 3 }, { opacity: 1, scale: 1, rotation: r, duration: 0.35, ease: "back.out(3)" }, t);
          });
          tl.fromTo("#s3-subt", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.33);
          // glitches: on "views" and just before "trend."
          [2.03, 3.0].forEach((t) => {
            tl.fromTo("#s3-busyfx", { x: 0, skewX: 0, filter: "hue-rotate(0deg)" },
              { keyframes: [{ x: 22, skewX: 8, filter: "hue-rotate(90deg)", duration: 0.05 }, { x: -16, skewX: -5, filter: "hue-rotate(200deg)", duration: 0.05 },
                            { x: 0, skewX: 0, filter: "hue-rotate(0deg)", duration: 0.06 }], immediateRender: false }, t);
          });

          // RIGHT: same footage, clean grade + calm motion type; the light moves from left to right on the second "Content"
          // (starts when the right phone's rise has finished at 2.00, so the two opacity tweens never overlap)
          tl.fromTo("#s3-pR", { opacity: 1 }, { opacity: 0.5, duration: 0.4, immediateRender: false }, 2.0);
          tl.to("#s3-pR", { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.76);
          tl.to("#s3-pL", { opacity: 0.5, duration: 0.5, ease: "power2.out" }, 3.76);
          tl.fromTo("#s3-cleanfx", { scale: 1 }, { scale: 1.07, duration: 6, ease: "none" }, 0.82);
          tl.fromTo("#s3-c1", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 4.6);
          tl.fromTo("#s3-c2", { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 4.98);
          tl.fromTo("#s3-c3", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 5.3);

          // Crane down to the bento of what we showed instead (on "So"); the whole split screen leaves with it
          tl.to("#s3-split", { y: -1700, duration: 0.95, ease: "power3.inOut" }, 6.88);
          tl.to("#s3-bento", { y: -1700, duration: 0.95, ease: "power3.inOut" }, 6.88);
          const tiles = [["#s3-tB", 8.87], ["#s3-tQ", 10.13], ["#s3-tS", 11.53]];
          tiles.forEach(([s]) => tl.fromTo(s, { opacity: 0.32, scale: 0.94, filter: "brightness(0.55)" },
            { opacity: 0.32, scale: 0.94, filter: "brightness(0.55)", duration: 0.01 }, 6.85));
          tiles.forEach(([s, t]) => {
            tl.to(s, { opacity: 1, scale: 1, filter: "brightness(1)", duration: 0.55, ease: "expo.out" }, t);
            tl.fromTo(s + " img", { scale: 1.14 }, { scale: 1.0, duration: 2.6, ease: "power2.out" }, t);
            tl.fromTo(s + " .lb b", { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, t + 0.08);
          });
          // five stars after "customers."
          q("#s3-tS .stars svg").forEach((st, i) => {
            tl.fromTo(st, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 11.9 + i * 0.1);
          });
          tl.fromTo("#s3-bento", { scale: 1 }, { scale: 1.035, transformOrigin: "540px 200px", duration: 6.25, ease: "sine.inOut", immediateRender: false }, 7.66);

          // Whip pan out: the whole dark world (bg included) streaks off to the right; the white world is underneath
          tl.to("#s3-stage", { x: 1250, scaleX: 1.06, filter: "blur(18px)", duration: 0.55, ease: "power3.in" }, 13.34);

          window.__timelines["s3"] = tl;
        })();
      </script>
