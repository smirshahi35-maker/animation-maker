<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Superline"; src: url("assets/fonts/Superline-Italic.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #1d1d1f; background: #f5f5f7; }
        .sl { font-family: "Superline", sans-serif; font-weight: normal; font-style: normal; font-synthesis: none;
              font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; letter-spacing: 0.005em; }
        .s1-bg { position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 40%, #fbfbfc 0%, #f5f5f7 60%, #e6e6eb 100%); }
        .s1-world { position: absolute; left: 0; top: 0; width: 1080px; height: 3400px; }
        .card { position: absolute; width: 300px; height: 400px; border-radius: 38px; background: #ffffff;
                box-shadow: 0 34px 70px rgba(0, 0, 0, 0.13), 0 3px 8px rgba(0, 0, 0, 0.06); }
        .vthumb { position: absolute; left: 22px; right: 22px; top: 22px; height: 236px; border-radius: 24px;
                  background: linear-gradient(160deg, #eef4ff, #d9e6ff); display: flex; align-items: center; justify-content: center; }
        .vplay { width: 118px; height: 118px; border-radius: 50%; background: #0071e3; display: flex; align-items: center; justify-content: center;
                 box-shadow: 0 14px 30px rgba(0, 113, 227, 0.35); }
        .vtri { width: 0; height: 0; margin-left: 10px; border-left: 40px solid #ffffff; border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        .vmeta { position: absolute; left: 30px; right: 30px; bottom: 30px; display: flex; justify-content: space-between; align-items: baseline; }
        .vmeta b { font-size: 66px; line-height: 1; padding-right: 0.06em; margin-right: -0.06em; }
        .vmeta span { font-size: 28px; font-weight: 600; color: #86868b; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
        .inv { position: absolute; inset: 30px 30px 26px 30px; display: flex; flex-direction: column; gap: 14px; }
        .inv h4 { margin: 0; font-size: 70px; line-height: 0.92; padding-right: 0.06em; margin-right: -0.06em; }
        .inv small { font-size: 21px; font-weight: 600; color: #6e6e73; margin-top: -4px; letter-spacing: -0.005em; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .row i { display: block; height: 12px; border-radius: 6px; background: #e8e8ed; }
        .inv .sum { margin-top: auto; border-top: 2px solid #e8e8ed; padding-top: 10px; display: flex; justify-content: space-between; align-items: baseline; }
        .inv .sum em { font-style: normal; font-size: 21px; font-weight: 600; color: #6e6e73; }
        .inv .sum b { font-size: 56px; line-height: 1; padding-right: 0.06em; margin-right: -0.06em; }
        .s1-binwrap { position: absolute; left: 230px; top: 2230px; width: 620px; height: 890px; transform-origin: 50% 100%; }
        .s1-binwrap img { position: absolute; left: 0; top: 0; width: 620px; height: 890px; display: block; }
        .s1-floor { position: absolute; left: 160px; top: 3060px; width: 760px; height: 120px; border-radius: 50%;
                    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0)); }
        .s1-hole { position: absolute; left: 250px; top: 2244px; width: 580px; height: 235px; border-radius: 50%; background: #000; opacity: 0;
                   filter: blur(6px); }
        .s1-ballclip { position: absolute; left: 0; top: 0; width: 1080px; height: 2468px; overflow: hidden; }
        .ball { position: absolute; display: block; filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.18)); opacity: 0; }
        .txt { position: absolute; left: 96px; right: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .ln { display: block; white-space: nowrap; line-height: 1; }
        .w { display: inline-block; opacity: 0; padding-right: 0.06em; margin-right: -0.06em; }
        .h1 { font-size: 196px; color: #1d1d1f; }
        .h2 { font-size: 110px; color: #6e6e73; }
        .h0 { font-size: 224px; line-height: 0.98; color: #1d1d1f; }
        .red { color: #ff3b30; }
        .s1-black { position: absolute; inset: 0; background: #000; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div class="s1-bg"></div>
        <div class="s1-world" id="s1-tilt" data-layout-allow-overflow>
          <div class="s1-world" id="s1-dive">
            <div class="s1-world" id="s1-push">
              <div id="s1-cards" style="position:absolute; left:0; top:0; width:1080px; height:2000px; transform:scale(1.3); transform-origin:540px 1040px">
              <div class="card" id="s1-vcard" style="left:230px; top:800px">
                <div class="vthumb"><div class="vplay"><div class="vtri"></div></div></div>
                <div class="vmeta"><b class="sl">MP4</b><span>02:14</span></div>
              </div>
              <div class="card" id="s1-icard" style="left:550px; top:880px">
                <div class="inv">
                  <h4 class="sl">INVOICE</h4>
                  <small>Content production</small>
                  <div class="row"><i style="width:120px"></i><i style="width:60px"></i></div>
                  <div class="row"><i style="width:96px"></i><i style="width:70px"></i></div>
                  <div class="row"><i style="width:132px"></i><i style="width:52px"></i></div>
                  <div class="row"><i style="width:84px"></i><i style="width:66px"></i></div>
                  <div class="sum"><em>Total</em><b class="sl">$2,400</b></div>
                </div>
              </div>
              </div>
              <div class="s1-floor"></div>
              <div class="s1-binwrap" id="s1-bin"><img src="assets/ai/web/bin.png" alt="" /></div>
              <div class="s1-hole" id="s1-hole"></div>
              <div class="s1-ballclip">
                <img class="ball" id="s1-bv" src="assets/ai/web/ball-video.png" alt="" style="left:214px; top:864px; width:236px; height:248px" />
                <img class="ball" id="s1-bi" src="assets/ai/web/ball-invoice.png" alt="" style="left:623px; top:975px; width:250px; height:233px" />
              </div>
            </div>
          </div>
        </div>

        <div class="txt sl" id="s1-a" style="top:236px">
          <span class="ln h1"><span class="w" data-t="0.28">IF</span> <span class="w" data-t="0.44">YOU</span> <span class="w" data-t="0.58">DON’T</span> <span class="w" data-t="0.78">KNOW</span></span>
          <span class="ln h1"><span class="w" data-t="0.98">THIS</span> <span class="w" data-t="1.34">ONE</span> <span class="w" data-t="1.64">TIP…</span></span>
        </div>
        <div class="txt sl" id="s1-b" style="top:262px">
          <span class="ln h2"><span class="w" data-t="2.44">EVERYTHING</span> <span class="w" data-t="2.82">YOU’VE</span> <span class="w" data-t="3.02">SPENT</span></span>
          <span class="ln h2"><span class="w" data-t="3.26">ON</span> <span class="w" data-t="3.42">CONTENT</span> <span class="w" data-t="3.86">SO</span> <span class="w" data-t="4.06">FAR,</span></span>
        </div>
        <div class="txt sl" id="s1-c" style="top:318px">
          <span class="ln h0"><span class="w" data-t="4.72">THROW</span> <span class="w" data-t="4.94">IT</span></span>
          <span class="ln h0 red"><span class="w" data-t="5.02">IN</span> <span class="w" data-t="5.12">THE</span> <span class="w" data-t="5.26">TRASH.</span></span>
        </div>
        <div class="s1-black" id="s1-black"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s1"]');
          const q = (s) => root.querySelectorAll(s);

          // Words: soft blur + rise on their narration time (English VO, scene-local seconds)
          q(".w[data-t]").forEach((el) => {
            tl.fromTo(el, { opacity: 0, y: 28, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, +el.dataset.t);
          });
          tl.to("#s1-a", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, 2.05); // after "tip," clears before "everything"
          tl.to("#s1-b", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 4.38); // gone before "throw" (4.72)
          // Rushes past the lens with the dive: same screen origin as the dive (540, 968) -> element-local (444, 968 - 318)
          tl.to("#s1-c", { opacity: 0, y: -260, scale: 1.6, transformOrigin: "444px 650px", filter: "blur(14px)", duration: 0.24, ease: "power2.in" }, 5.80);

          // Camera: slow push, then tilt down with the falling paper (on "content"), then dive into the bin
          tl.fromTo("#s1-push", { scale: 1, transformOrigin: "540px 1040px" }, { scale: 1.05, duration: 3.4, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-tilt", { y: 0 }, { y: -1460, duration: 1.68, ease: "power3.inOut" }, 3.40);
          // Origin = centre of the bin opening (#s1-hole) in dive space: push maps y 2361.5 -> 1040 + 1.05*(2361.5-1040) = 2427.6,
          // which the tilt (-1460) puts at screen y ~968, so the opening grows in place until it swallows the frame.
          // power3.in keeps the bin small while "TRASH." is read, then rushes in; #s1-black is the contract with s2 (6.12).
          tl.fromTo("#s1-dive", { scale: 1, transformOrigin: "540px 2428px" }, { scale: 14, duration: 0.55, ease: "power3.in" }, 5.56);
          tl.to("#s1-hole", { opacity: 1, duration: 0.25, ease: "power1.in" }, 5.56);
          tl.set("#s1-black", { opacity: 1 }, 6.12);

          // Cards float before they are crumpled
          tl.fromTo("#s1-vcard", { rotation: -9, y: 0 }, { rotation: -6, y: -16, duration: 2.2, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-icard", { rotation: 7, y: 0 }, { rotation: 4, y: -12, duration: 2.6, ease: "sine.inOut" }, 0);

          // Crumple: card collapses, the GPT paper ball pops in its place
          function crumple(card, ball, t, spin) {
            tl.to(card, { scale: 0.32, rotation: spin, opacity: 0, filter: "blur(4px)", duration: 0.2, ease: "power2.out" }, t); // front-loaded: the card squashes into the ball
            tl.fromTo(ball, { opacity: 0, scale: 0.6, rotation: -spin },
              { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, t + 0.1);
          }
          crumple("#s1-vcard", "#s1-bv", 2.40, -40); // on "everything"
          crumple("#s1-icard", "#s1-bi", 2.78, 36);  // right after, on "you've"

          // Gravity: a small lift, then the fall into the bin opening (with the tilt, on "content")
          tl.to("#s1-bv", { y: -36, duration: 0.3, ease: "power2.out" }, 3.02);
          tl.fromTo("#s1-bv", { x: 0, y: -36, rotation: 0 }, { x: 138, y: 1720, rotation: 250, duration: 1.34, ease: "power2.in", immediateRender: false }, 3.40);
          tl.to("#s1-bi", { y: -34, duration: 0.27, ease: "power2.out" }, 3.08);
          tl.fromTo("#s1-bi", { x: 0, y: -34, rotation: 0 }, { x: -143, y: 1640, rotation: -230, duration: 1.31, ease: "power2.in", immediateRender: false }, 3.35);

          // The bin answers each landing (the second one on "throw")
          [4.56, 4.72].forEach((t, i) => {
            tl.fromTo("#s1-bin", { rotation: 0, scaleY: 1 },
              { keyframes: [{ rotation: i ? -1.1 : 1.4, scaleY: 0.985, duration: 0.08, ease: "power2.out" },
                            { rotation: 0, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }], immediateRender: false }, t);
          });

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
