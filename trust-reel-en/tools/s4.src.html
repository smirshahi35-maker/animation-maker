      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s4"]');
          const q = (s) => root.querySelectorAll(s);
          const en = (n) => Math.round(n).toLocaleString("en-US");
          const WALL = 1 / 0.165;

          // Word reveals on the English narration (data-t = scene-local start of the spoken word)
          q(".w[data-t]").forEach((el) => {
            tl.fromTo(el, { opacity: 0, y: 28, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, +el.dataset.t);
          });
          const out = (sel, t, d) => tl.to(sel, { opacity: 0, y: -44, filter: "blur(12px)", duration: d || 0.34, ease: "power2.in" }, t);

          // A) Whip in from the left onto the same inbox: "Views went down, but the DMs filled up."
          tl.fromTo("#s4-wall", { x: -1250, scale: WALL, rotation: 0, filter: "blur(18px)", transformOrigin: "540px 1163px" },
            { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.12);
          tl.to("#s4-wall", { scale: WALL * 1.05, duration: 1.45, ease: "sine.inOut" }, 1.3);
          tl.fromTo("#s4-bv", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.18); // "Views"
          const vw = { v: 80000 };
          tl.fromTo(vw, { v: 80000 }, { v: 24000, duration: 0.8, ease: "power2.out",
            onUpdate: () => { document.getElementById("s4-views").textContent = en(Math.round(vw.v / 100) * 100); } }, 0.44); // "went down,"
          tl.fromTo("#s4-bd", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.38); // "but"
          const ms = { v: 0 };
          tl.fromTo(ms, { v: 0 }, { v: 47, duration: 1.2, ease: "power1.out", immediateRender: false,
            onUpdate: () => { document.getElementById("s4-msgs").textContent = "+" + en(ms.v); } }, 1.46);
          tl.to("#s4-empty", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, 1.38);
          q(".row").forEach((r, i) => {
            tl.fromTo(r, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 1.50 + i * 0.14); // "the DMs filled up." (a dm-ping per row 0-5)
          });
          out("#s4-tA", 2.80, 0.26); // gone (3.06) before the wall tiles land behind it
          tl.to(["#s4-bv", "#s4-bd"], { opacity: 0, scale: 0.85, duration: 0.22, ease: "power2.in" }, 2.72);

          // B) Pull out: the phone becomes one tile of a 500-project wall (its screen turns into a project frame)
          tl.to("#s4-ui", { opacity: 0, duration: 0.18, ease: "power1.in" }, 2.70);
          tl.fromTo("#s4-scrimg", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.in" }, 2.82); // the DM list is gone before the project frame shows
          tl.to("#s4-wall", { scale: 1, rotation: -8, duration: 0.75, ease: "power3.inOut" }, 2.75);
          q(".tl").forEach((t) => {
            tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.98 + (+t.dataset.d) * 0.04); // under a clean frame: the headline is gone by 3.06
          });
          tl.to("#s4-wall", { scale: 1.06, rotation: -9.5, duration: 3.75, ease: "sine.inOut" }, 3.5); // slow drift, ends before the push-through (7.28)
          // Glass intro card arrives on "I'm" (3.54); SHAHIN lands on "Shaheen," (3.70)
          tl.fromTo("#s4-glass", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.42);
          tl.fromTo("#s4-glass", { y: 260, scale: 0.94 }, { y: 0, scale: 1, duration: 0.8, ease: "expo.out", immediateRender: false }, 3.42);
          tl.fromTo("#s4-glass .avbig img", { scale: 1.12 }, { scale: 1, duration: 3.5, ease: "power2.out" }, 3.32);
          // rack focus: the body of work softens behind the hero card
          tl.fromTo("#s4-wall", { filter: "blur(0px) saturate(1) brightness(1)" }, { filter: "blur(5px) saturate(0.8) brightness(1.05)", duration: 0.8, ease: "power2.out", immediateRender: false }, 4.15);
          const pn = { v: 0 };
          // "five hundred": 0.95 s as in the Persian cut, so the number is still climbing under the counter-ticks sfx
          // and settles at 500 (7.13) 0.15 s before the push-through (7.28), the same relation as the Persian film
          tl.fromTo(pn, { v: 0 }, { v: 500, duration: 0.95, ease: "power2.out", immediateRender: false,
            onUpdate: () => { document.getElementById("s4-pn").textContent = en(pn.v); } }, 6.18);

          // C) Follow
          // Push-through right after "projects." (ends 7.24): the camera flies forward through the wall; the profile card arrives out of the depth (no overlap)
