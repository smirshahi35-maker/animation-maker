<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>Reel cover</title>
<style>
  @font-face { font-family: "AbarMid"; src: url("../fonts/AbarMid-Bold.ttf") format("truetype"); font-display: block; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #163a2a; }
  .stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background:
      radial-gradient(70% 45% at 22% 18%, rgba(120, 170, 140, .28), rgba(120, 170, 140, 0) 70%),
      radial-gradient(90% 60% at 50% 55%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .35) 100%),
      linear-gradient(165deg, #2d5f47 0%, #1d4433 42%, #12301f 100%);
  }
  .grain { position: absolute; inset: 0; opacity: .14; mix-blend-mode: overlay; }
  .logo { position: absolute; left: 50%; top: 372px; width: 360px; transform: translateX(-50%);
          filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35)); }
  .title { position: absolute; left: 40px; right: 40px; top: 860px; text-align: center; direction: rtl;
           font-family: "AbarMid", sans-serif; color: #fff; line-height: 1.32;
           text-shadow: 0 6px 18px rgba(0, 0, 0, .35); font-synthesis: none; }
  .title .l1 { font-size: 104px; }
  .title .l2 { font-size: 118px; }
  .flag { position: absolute; left: 50%; top: 1268px; width: 400px; transform: translateX(-50%);
          filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .4)); }
</style>
</head>
<body>
<div class="stage">
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <img class="logo" src="../assets/logo.png" alt="">
  <div class="title"><div class="l1">تو ارمنستان</div><div class="l2">سرمایه‌گذاری نکن!</div></div>
  <img class="flag" src="flag.png" alt="">
</div>
</body>
</html>
