<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Style frame</title>
<style>
  @font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-ExtraBold.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Nastaliq"; src: url("../fonts/NotoNastaliqUrdu.ttf") format("truetype"); font-weight: 400 700; }
  @font-face { font-family: "Ruqaa"; src: url("../fonts/ArefRuqaa-Bold.ttf") format("truetype"); font-weight: 700; }

  :root {
    --ink: #1c1b1a;
    --pink: #e23fd6;
    --orange: #f5862b;
    --red: #d23a32;
    --grad: linear-gradient(270deg, var(--pink) 0%, #f0538f 45%, var(--orange) 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4ede1; }
  .stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 45%, #fbf6ec 0%, #f3ead9 55%, #e4d8c3 100%);
    font-family: "Vazirmatn", sans-serif; color: var(--ink);
  }
  .grain { position: absolute; inset: 0; opacity: .16; mix-blend-mode: multiply; pointer-events: none; z-index: 8; }

  /* real-footage palm shadow, multiplied onto the paper */
  .palm { position: absolute; width: 1150px; opacity: .8; z-index: 1; }
  .palm.tl { top: -470px; left: -380px; transform: rotate(122deg); }
  .palm.br { bottom: -520px; right: -380px; transform: rotate(-56deg); }

  /* corner props: real apricot cut-outs (stand-ins for the reference's pocket watches) */
  .prop { position: absolute; z-index: 2; filter: drop-shadow(20px 28px 24px rgba(70, 45, 20, .33)); }
  .prop.tr { width: 400px; top: -120px; right: -130px; transform: rotate(-18deg); }
  .prop.bl { width: 380px; bottom: -130px; left: -150px; transform: rotate(24deg); }

  /* viewfinder UI */
  .vf { position: absolute; inset: 0; pointer-events: none; opacity: .7; z-index: 7; direction: ltr; }
  .vf text { font-family: "Vazirmatn", sans-serif; font-weight: 500; font-size: 22px; fill: #3a3836; }

  /* footage sticker */
  .sticker {
    position: absolute; left: 50%; top: 50%;
    width: 600px; height: 780px; margin-left: -300px; margin-top: -370px;
    border: 14px solid #fffdf8; border-radius: 40px; overflow: hidden;
    box-shadow: 0 44px 70px rgba(60, 40, 20, .26), 0 6px 14px rgba(60, 40, 20, .16);
    transform: rotate(-3deg); z-index: 4; background: #ddd;
  }
  .sticker img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sticker .px { clip-path: polygon(0 18%, 18% 18%, 18% 26%, 26% 26%, 26% 44%, 32% 44%, 32% 58%, 22% 58%, 22% 66%, 12% 66%, 12% 74%, 0 74%); }

  /* typography */
  .t { position: absolute; white-space: nowrap; }
  .sans { font-weight: 800; }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .nast { font-family: "Nastaliq"; font-weight: 700; line-height: 2; }
  .hand { font-family: "Ruqaa"; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .counter { font-weight: 700; font-size: 34px; color: #3a3836; display: flex; align-items: center; gap: 14px; }
  .counter::before, .counter::after { content: ""; width: 70px; height: 3px; background: #3a3836; opacity: .6; }
  .stamp {
    position: absolute; z-index: 6; font-weight: 800; color: var(--red);
    border: 7px solid var(--red); border-radius: 16px; padding: 0 26px 8px;
    font-size: 88px; transform: rotate(-9deg); background: rgba(255, 250, 244, .55);
  }
  .caption {
    position: absolute; z-index: 6; left: 90px; right: 90px; top: 1585px; text-align: center;
    font-weight: 700; font-size: 36px; line-height: 1.6; color: var(--ink);
    text-shadow: 0 0 12px #fbf6ec, 0 0 4px #fbf6ec;
  }
  .frame { display: none; } .frame.on { display: block; }
</style>
</head>
<body>
<div class="stage">
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .35  0 0 0 .9 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <img class="palm tl" src="assets/palm_shadow.png">
  <img class="palm br" src="assets/palm_shadow.png">
  <img class="prop tr" src="assets/apricot_pit.png">
  <img class="prop bl" src="assets/apricot_half.png">

  <svg class="vf" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g stroke="#3a3836" stroke-width="3" fill="none" id="vfg">
      <line x1="34" y1="1060" x2="34" y2="1122"/><circle cx="34" cy="1160" r="22"/><line x1="34" y1="1198" x2="34" y2="1260"/>
      <line x1="300" y1="1866" x2="300" y2="1892"/><line x1="440" y1="1866" x2="440" y2="1892"/><line x1="494" y1="1866" x2="494" y2="1892"/>
      <circle cx="800" cy="1872" r="22"/><line x1="700" y1="1872" x2="778" y2="1872"/><line x1="822" y1="1872" x2="900" y2="1872"/>
      <rect x="760" y="1790" width="10" height="40" stroke-width="2"/><line x1="776" y1="1830" x2="832" y2="1830"/><line x1="776" y1="1820" x2="826" y2="1820"/>
    </g>
    <text x="780" y="1810" style="font-size:26px">1.8</text>
    <text x="306" y="1884" style="font-size:18px">5</text><text x="446" y="1884" style="font-size:18px">2</text><text x="500" y="1884" style="font-size:18px">1</text>
  </svg>

  <!-- FRAME 1: hook -->
  <div class="frame" id="f1">
    <div class="sticker"><img src="assets/cascade_front.jpg"><img class="px" src="assets/cascade_front_px.jpg"></div>
    <div class="t sans grad" style="top:286px; right:118px; font-size:84px; z-index:5;">تو ارمنستان</div>
    <div class="t nast grad" style="top:350px; left:96px; font-size:118px; z-index:3;">سرمایه‌گذاری</div>
    <div class="stamp" style="top:640px; left:150px; font-size:92px;">نکن!</div>
    <div class="t hand" style="top:1318px; right:120px; font-size:80px; z-index:5;">مگه اینکه این ۳ حقیقت رو بدونی...</div>
  </div>

  <!-- FRAME 2: truth 1 -->
  <div class="frame" id="f2">
    <div class="sticker"><img src="assets/grapes.jpg"><img class="px" src="assets/grapes_px.jpg"></div>
    <div class="t counter" style="top:300px; left:50%; transform:translateX(-50%);">حقیقت ۱ از ۳</div>
    <div class="t nast" style="top:318px; right:140px; font-size:132px; z-index:3; color:var(--red);">زمین</div>
    <div class="t sans" style="top:500px; left:116px; font-size:74px; z-index:5;">به نام خارجی</div>
    <div class="stamp" style="top:820px; left:300px;">ممنوع</div>
    <div class="t hand" style="top:1318px; right:150px; font-size:88px; z-index:5;">قولنامه ≠ مالکیت</div>
    <div class="caption">یک: زمین به اسم خارجی ثبت نمی‌شه، و تا سندت توی کاداستر ثبت نشه مالک نیستی</div>
  </div>

  <!-- FRAME 3: good news / property -->
  <div class="frame" id="f3">
    <div class="sticker" style="transform:rotate(2.5deg);"><img src="assets/cascade_top.jpg"><img class="px" src="assets/cascade_top_px.jpg"></div>
    <div class="t nast grad" style="top:360px; right:120px; font-size:128px; z-index:3;">خبر خوب</div>
    <div class="t sans" style="top:520px; left:116px; font-size:64px; z-index:5;">ملک در ایروان</div>
    <div class="t sans grad" style="top:1290px; right:104px; font-size:150px; z-index:5; line-height:1.3;">۵ تا ۸٪</div>
    <div class="t hand" style="top:1500px; right:150px; font-size:68px; z-index:5;">بازده اجاره در سال</div>
  </div>
</div>
<script>
  const ns = 'http://www.w3.org/2000/svg', vf = document.querySelector('.vf'), g = document.getElementById('vfg');
  function tick(y, label) {
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', 22); l.setAttribute('x2', 46); l.setAttribute('y1', y); l.setAttribute('y2', y);
    g.appendChild(l);
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', 28); t.setAttribute('y', y - 8); t.textContent = label; vf.appendChild(t);
  }
  [9,8,7,6,5,4,3,2,1].forEach((n, i) => tick(430 + i * 52, n));
  [1,2,3,4,5,6].forEach((n, i) => tick(1470 + i * 52, n));
  document.getElementById((location.hash || '#f1').slice(1)).classList.add('on');
</script>
</body>
</html>
