<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:VZ;src:url(Vazirmatn-ExtraLight.ttf);font-weight:200}
@font-face{font-family:VZ;src:url(Vazirmatn-Light.ttf);font-weight:300}
@font-face{font-family:IN;src:url(Inter-Light.otf);font-weight:300}
html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
.card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#f3eee6;
  text-shadow:0 0 18px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
.fa{direction:rtl;font-family:VZ;font-synthesis:none}
.ltr{direction:ltr;unicode-bidi:isolate}
#opening .time{font-family:VZ;font-weight:200;font-size:118px;letter-spacing:.06em;line-height:1.1}
#opening .sub{font-weight:300;font-size:34px;opacity:.7;margin-top:6px;word-spacing:.2em}
#title_fa,#title_en{align-items:flex-end;justify-content:flex-start;padding-right:330px;box-sizing:border-box}
#title_fa{padding-top:232px}
#title_fa .t{font-weight:200;font-size:178px;line-height:1.25}
#title_en{padding-top:478px}
#title_en .t{font-family:IN;font-weight:300;font-size:24px;letter-spacing:.85em;margin-right:-.85em;opacity:.82}
#title_en .rule{width:64px;height:1px;background:#f3eee6;opacity:.5;margin-top:20px}
#end .t{font-weight:200;font-size:66px;margin-top:150px;word-spacing:.08em}
</style></head><body>
<div class="card" id="opening"><div class="time ltr">۰۲:۲۰</div><div class="sub fa">بامداد</div></div>
<div class="card" id="title_fa"><div class="t fa">شبگرد</div></div>
<div class="card" id="title_en"><div class="t">NIGHT DRIVE</div><div class="rule"></div></div>
<div class="card" id="end"><div class="t fa">شهر خواب بود، ما نه.</div></div>
</body></html>
