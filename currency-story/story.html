<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>Currency Story</title>
<style>
  @font-face { font-family: "Lalezar"; src: url("fonts/Lalezar-ar.woff2") format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; font-display: block; }
  @font-face { font-family: "Lalezar"; src: url("fonts/Lalezar-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; font-display: block; }
  @font-face { font-family: "Vazirmatn"; src: url("fonts/Vazirmatn-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }

  :root {
    --green-1: #2f5e49;
    --green-2: #1b4134;
    --green-3: #10291f;
    --ink: #0c2d22;
    --cream: #f8f2e6;
    --gold-1: #f0d48c;
    --gold-2: #d9ae4c;
    --gold-3: #b8862a;
    --down: #d9473c;
    --down-bg: #fbe0da;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; }
  body {
    direction: rtl;
    font-family: "Lalezar", "Vazirmatn", sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(ellipse 90% 45% at 85% 0%, rgba(80, 140, 108, .55) 0%, transparent 70%),
      radial-gradient(ellipse 80% 40% at 10% 100%, rgba(0, 0, 0, .35) 0%, transparent 70%),
      linear-gradient(180deg, var(--green-1) 0%, var(--green-2) 48%, var(--green-3) 100%);
  }
  /* faint currency glyphs in the background */
  .ghosts { position: absolute; inset: 0; overflow: hidden; }
  .ghost { position: absolute; font-family: "Vazirmatn"; font-weight: 900; color: rgba(240, 212, 140, .05); line-height: 1; direction: ltr; }

  header { position: absolute; top: 175px; left: 0; right: 0; text-align: center; }
  .pill {
    display: inline-block;
    padding: 10px 44px 4px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
    color: var(--ink);
    font-size: 44px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  h1 { font-weight: 400; font-size: 168px; line-height: 1.15; margin-top: 18px; text-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
  h1 .gold {
    background: linear-gradient(180deg, #f7e2a6 0%, var(--gold-2) 60%, var(--gold-3) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-family: "Vazirmatn"; font-weight: 600; font-size: 38px; color: rgba(248, 242, 230, .82); margin-top: 6px; }
  .rule { width: 240px; height: 4px; margin: 34px auto 0; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); }

  .cards { position: absolute; top: 665px; left: 60px; right: 60px; display: flex; flex-direction: column; gap: 34px; }
  .card {
    background: var(--cream);
    border: 3px solid var(--gold-2);
    border-radius: 44px;
    padding: 34px 40px 30px;
    color: var(--ink);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .28);
  }
  .row1 { display: flex; align-items: center; gap: 30px; }
  .flag { width: 140px; height: 140px; flex: none; border-radius: 50%; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--gold-2), 0 8px 18px rgba(0, 0, 0, .2); overflow: hidden; }
  .flag svg { display: block; width: 100%; height: 100%; }
  .name { font-size: 62px; line-height: 1.2; }
  .code { display: inline-block; margin-top: 4px; font-family: "Vazirmatn"; font-weight: 700; font-size: 28px; letter-spacing: 3px; color: #6f8a7d; direction: ltr; }
  .price { margin-inline-start: auto; text-align: left; white-space: nowrap; }
  .price .num { font-size: 104px; line-height: 1; }
  .price .unit { font-size: 38px; color: #557466; margin-inline-start: 10px; }

  .row2 { display: flex; align-items: center; gap: 28px; margin-top: 18px; }
  .spark { flex: 1; height: 86px; }
  .spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .badge {
    flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 30px 6px;
    border-radius: 999px;
    background: var(--down-bg);
    color: var(--down);
    font-size: 46px;
  }
  .badge svg { width: 26px; height: 22px; margin-top: -6px; }

  footer { position: absolute; top: 1716px; left: 0; right: 0; text-align: center; font-family: "Vazirmatn"; font-weight: 500; font-size: 30px; color: rgba(248, 242, 230, .6); }
</style>
</head>
<body>
  <div class="ghosts">
    <div class="ghost" style="font-size:520px; top:330px; left:-90px; transform:rotate(-12deg)">$</div>
    <div class="ghost" style="font-size:440px; top:1330px; right:-70px; transform:rotate(10deg)">€</div>
  </div>

  <header>
    <div class="pill">به تومان</div>
    <h1>نرخ ارز <span class="gold">امروز</span></h1>
    <div class="sub">قیمت دلار، درام و یورو</div>
    <div class="rule"></div>
  </header>

  <section class="cards" id="cards"></section>

  <footer>نرخ‌ها ممکن است در طول روز تغییر کنند</footer>

<script>
  const FLAGS = {
    usd: (() => {
      let s = '<svg viewBox="0 0 190 190" xmlns="http://www.w3.org/2000/svg">';
      for (let i = 0; i < 13; i++) s += `<rect x="0" y="${i * 190 / 13}" width="190" height="${190 / 13 + .5}" fill="${i % 2 ? '#fff' : '#b22234'}"/>`;
      s += '<rect x="0" y="0" width="92" height="102.3" fill="#3c3b6e"/>';
      const star = (cx, cy, r) => {
        let p = [];
        for (let k = 0; k < 10; k++) {
          const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .4 : r;
          p.push((cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2));
        }
        return `<polygon points="${p.join(' ')}" fill="#fff"/>`;
      };
      for (let r = 0; r < 9; r++) {
        const cols = r % 2 ? 5 : 6;
        for (let c = 0; c < cols; c++) s += star(8 + c * 15.2 + (r % 2 ? 7.6 : 0), 6 + r * 11.2, 4.2);
      }
      return s + '</svg>';
    })(),
    amd: '<svg viewBox="0 0 3 3" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="3" height="1.02" fill="#d90012"/><rect y="1" width="3" height="1.02" fill="#0033a0"/><rect y="2" width="3" height="1" fill="#f2a800"/></svg>',
    eur: (() => {
      let s = '<svg viewBox="0 0 190 190" xmlns="http://www.w3.org/2000/svg"><rect width="190" height="190" fill="#003399"/>';
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6, cx = 95 + 58 * Math.cos(a), cy = 95 + 58 * Math.sin(a);
        let p = [];
        for (let k = 0; k < 10; k++) {
          const b = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 4.4 : 11;
          p.push((cx + rr * Math.cos(b)).toFixed(2) + ',' + (cy + rr * Math.sin(b)).toFixed(2));
        }
        s += `<polygon points="${p.join(' ')}" fill="#ffcc00"/>`;
      }
      return s + '</svg>';
    })(),
  };

  // y values traced from the screenshot's sparklines (screen px, lower = higher price), evenly spaced in time
  const RATES = [
    { id: 'usd', name: 'دلار آمریکا', code: 'USD', price: 267800, change: 1.25,
      trace: [[0, 72], [20, 72], [60, 122], [80, 119], [100, 124], [120, 152], [140, 167], [160, 150], [320, 150]] },
    { id: 'amd', name: 'درام ارمنستان', code: 'AMD', price: 750, change: 1.43,
      trace: [[0, 330], [20, 345], [40, 398], [60, 361], [80, 361], [100, 366], [120, 388], [300, 388], [320, 426]] },
    { id: 'eur', name: 'یورو', code: 'EUR', price: 299850, change: 1.54,
      trace: [[0, 588], [20, 590], [40, 620], [60, 642], [80, 640], [100, 645], [120, 675], [140, 683], [320, 683]] },
  ];

  const fa = n => n.toLocaleString('fa-IR', { maximumFractionDigits: 2 });

  function spark(trace, gid) {
    const W = 600, H = 86, pad = 6;
    const ys = trace.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys);
    const pts = trace.map(([x, y]) => [x / 320 * W, pad + (y - lo) / (hi - lo) * (H - 2 * pad)]);
    const line = pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
    const last = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d9473c" stop-opacity=".22"/><stop offset="1" stop-color="#d9473c" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="0,${H} ${line} ${W},${H}" fill="url(#${gid})"/>
      <polyline points="${line}" fill="none" stroke="#d9473c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="7" fill="#d9473c" stroke="#f8f2e6" stroke-width="3" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  document.getElementById('cards').innerHTML = RATES.map(r => `
    <article class="card">
      <div class="row1">
        <div class="flag">${FLAGS[r.id]}</div>
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="code">${r.code}</div>
        </div>
        <div class="price"><span class="num">${fa(r.price)}</span><span class="unit">تومان</span></div>
      </div>
      <div class="row2">
        <div class="spark">${spark(r.trace, 'g-' + r.id)}</div>
        <div class="badge">
          <svg viewBox="0 0 26 22"><polygon points="0,0 26,0 13,22" fill="currentColor"/></svg>
          <span>${fa(r.change).replace('٫', '/')}٪</span>
        </div>
      </div>
    </article>`).join('');
</script>
</body>
</html>
