<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #cfc4b2;
        }
        #paper-sheet {
          position: absolute;
          left: -40px;
          top: -60px;
          width: 1160px;
          height: 2040px;
          display: block;
        }
      </style>
      <div id="root" data-composition-id="paper" data-width="1080" data-height="1920">
        <img id="paper-sheet" src="assets/paper/paper.jpg" alt="" />
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // The sheet breathes very slowly under the whole film
          tl.fromTo("#paper-sheet", { x: 0, y: 0, scale: 1.0 }, { x: -18, y: 26, scale: 1.02, duration: 94.3, ease: "sine.inOut" }, 0);
          window.__timelines["paper"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
