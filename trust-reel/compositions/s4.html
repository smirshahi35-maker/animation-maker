          const q = (s) => root.querySelectorAll(s);
          const fa = (n) => Math.round(n).toLocaleString("fa-IR");
          const WALL = 1 / 0.165;

          q(".w[data-t]").forEach((el) => {
            tl.fromTo(el, { opacity: 0, y: 30, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, +el.dataset.t);
          });
          const out = (sel, t, d) => tl.to(sel, { opacity: 0, y: -44, filter: "blur(12px)", duration: d || 0.34, ease: "power2.in" }, t);

          // A) Whip in from the left onto the same inbox — now it fills up
          tl.fromTo("#s4-wall", { x: -1250, scale: WALL, rotation: 0, filter: "blur(18px)", transformOrigin: "540px 1163px" },
            { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.12);
          tl.to("#s4-wall", { scale: WALL * 1.05, duration: 1.45, ease: "sine.inOut" }, 1.3);
          tl.fromTo("#s4-bv", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.18);
          const vw = { v: 80000 };
          tl.fromTo(vw, { v: 80000 }, { v: 24000, duration: 0.9, ease: "power2.out",
            onUpdate: () => { document.getElementById("s4-views").textContent = fa(Math.round(vw.v / 100) * 100); } }, 0.45);
          tl.fromTo("#s4-bd", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.45);
          const ms = { v: 0 };
          tl.fromTo(ms, { v: 0 }, { v: 47, duration: 1.4, ease: "power1.out", immediateRender: false,
            onUpdate: () => { document.getElementById("s4-msgs").textContent = "+" + fa(ms.v); } }, 1.5);
          tl.to("#s4-empty", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, 1.45);
          q(".row").forEach((r, i) => {
            tl.fromTo(r, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 1.55 + i * 0.17);
          });
          out("#s4-tA", 2.88, 0.26); // gone before the wall tiles land behind it
          tl.to(["#s4-bv", "#s4-bd"], { opacity: 0, scale: 0.85, duration: 0.22, ease: "power2.in" }, 2.72);

          // B) Pull out: the phone becomes one tile of a 500-project wall (its screen turns into a project frame)
          tl.to("#s4-ui", { opacity: 0, duration: 0.18, ease: "power1.in" }, 2.66);
          tl.fromTo("#s4-scrimg", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.in" }, 2.8); // the DM list is gone before the project frame shows
          tl.to("#s4-wall", { scale: 1, rotation: -8, duration: 0.75, ease: "power3.inOut" }, 2.75);
          q(".tl").forEach((t) => {
            tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.95 + (+t.dataset.d) * 0.04);
          });
          tl.to("#s4-wall", { scale: 1.06, rotation: -9.5, duration: 4.0, ease: "sine.inOut" }, 3.5);
          tl.fromTo("#s4-glass", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.5);
          tl.fromTo("#s4-glass", { y: 260, scale: 0.94 }, { y: 0, scale: 1, duration: 0.8, ease: "expo.out", immediateRender: false }, 3.5);
          tl.fromTo("#s4-glass .avbig img", { scale: 1.12 }, { scale: 1, duration: 3.5, ease: "power2.out" }, 3.4);
          // rack focus: the body of work softens behind the hero card
          tl.fromTo("#s4-wall", { filter: "blur(0px) saturate(1) brightness(1)" }, { filter: "blur(5px) saturate(0.8) brightness(1.05)", duration: 0.8, ease: "power2.out", immediateRender: false }, 4.1);
          const pn = { v: 0 };
          tl.fromTo(pn, { v: 0 }, { v: 500, duration: 0.95, ease: "power2.out", immediateRender: false,
            onUpdate: () => { document.getElementById("s4-pn").textContent = fa(Math.round(pn.v)); } }, 6.45);

          // C) Morph to a profile card: follow
          // Push-through: the camera flies forward through the wall; the profile card arrives out of the depth (no overlap)
          tl.to("#s4-wall", { scale: "+=0.5", opacity: 0, filter: "blur(20px) saturate(0.8) brightness(1.05)", duration: 0.45, ease: "power3.in" }, 7.55);
          tl.to("#s4-glass", { opacity: 0, scale: 1.35, filter: "blur(14px)", duration: 0.35, ease: "power3.in" }, 7.55);
          tl.fromTo("#s4-prof", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 7.88);
          tl.fromTo("#s4-btn", { scale: 1 }, { keyframes: [{ scale: 0.93, duration: 0.09, ease: "power2.out" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }] }, 9.38);
          tl.fromTo("#s4-tap", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out", immediateRender: false }, 9.38);
          tl.to("#s4-btn", { backgroundColor: "#e8e8ed", duration: 0.2, ease: "none" }, 9.47);
          tl.to("#s4-b1", { opacity: 0, duration: 0.15 }, 9.47);
          tl.fromTo("#s4-b2", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 9.52);

          // D) Comment the word
          out("#s4-tC", 10.25);
          // Profile and composer tilt up together as one move; the card stays as the middle element
          tl.to("#s4-prof", { y: -260, scale: 0.7, duration: 0.7, ease: "power3.inOut" }, 10.12);
          tl.fromTo("#s4-comp", { opacity: 1, y: 700 }, { y: 0, duration: 0.7, ease: "power3.inOut" }, 10.12);
          // One continuous camera drift across the whole CTA (only #s4-all scale tween in the comp)
          tl.fromTo("#s4-all", { scale: 1 }, { scale: 1.05, transformOrigin: "540px 600px", duration: 7.2, ease: "none", immediateRender: false }, 10.45); // constant, visible drift to the end
          out("#s4-tD", 13.45, 0.22); // fully gone by 13.67, before "کلمه‌ی" (13.68) lands in the same band
          tl.to("#s4-prof", { opacity: 0, y: "-=60", filter: "blur(10px)", duration: 0.34, ease: "power2.in" }, 13.45);
          tl.to("#s4-ph", { opacity: 0, duration: 0.1 }, 13.7); // gone before the first letter (13.82)
          // Typing: whole-glyph states (پ -> پی -> پیج), caret follows the left (RTL) end of the text
          tl.set("#s4-typed", { clipPath: "inset(0 0 0 0%)" }, 13.82);
          tl.set("#s4-k1", { display: "inline" }, 13.82);
          tl.set("#s4-k1", { display: "none" }, 13.995);
          tl.set("#s4-k2", { display: "inline" }, 13.995);
          tl.set("#s4-k2", { display: "none" }, 14.17);
          tl.set("#s4-k3", { display: "inline" }, 14.17);
          tl.fromTo("#s4-caret", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "steps(1)", yoyo: true, repeat: 3, immediateRender: false }, 14.25);
          // Keyword pop: scale on back.out, blur separately on power2.out (a filter must never overshoot)
          tl.fromTo("#s4-big", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 14.21);
          tl.fromTo("#s4-big", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.45, ease: "power2.out", immediateRender: false }, 14.21);
          // Send: the typed word leaves the field and flies up into the big keyword
          tl.fromTo("#s4-send", { scale: 1 }, { keyframes: [{ scale: 0.86, duration: 0.08 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }] }, 15.35);
          tl.set("#s4-typed", { clipPath: "none" }, 15.38);
          // field word centre (822, 1306) -> big keyword ink centre (537, ~715); it takes on the keyword's blue as it lands
          tl.to("#s4-word", { y: -90, opacity: 0, duration: 0.28, ease: "power2.out" }, 15.39); // sent: lifts out of the field, the keyword pulses as it lands
          tl.to("#s4-caret", { opacity: 0, duration: 0.1 }, 15.39);
          tl.to("#s4-ph", { opacity: 1, duration: 0.25 }, 15.6);
          tl.fromTo("#s4-big", { scale: 1 }, { keyframes: [{ scale: 1.08, duration: 0.14, ease: "power2.out" }, { scale: 1, duration: 0.5, ease: "back.out(2)" }], immediateRender: false }, 15.9);

          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
