        .s2-ring .c b { font-size: 84px; font-weight: 900; line-height: 1.25; }
        .s2-ring .c span { font-size: 58px; font-weight: 700; color: #86868b; line-height: 1.2; }
      </style>

          <div class="s2-phonewrap" id="s2-phonewrap">

                  <img src="assets/ai/web/cafe-trend.jpg" alt="" />

                  <div class="views"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff" /></svg><span id="s2-views">۰</span></div>
                  <svg class="heart" id="s2-h1" viewBox="0 0 24 24"><path fill="#ff375f" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  <svg class="heart" id="s2-h2" viewBox="0 0 24 24"><path fill="#ff375f" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  <svg class="heart" id="s2-h3" viewBox="0 0 24 24"><path fill="#ffffff" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  <div class="acts">
                    <div class="act"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>۱۲K</span></div>
                    <div class="act"><svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20l1.1-4.6A8.5 8.5 0 1 1 21 11.5z"/></svg><span>۳۴۰</span></div>
                    <div class="act"><svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" d="M22 3 2 11l7 3 3 7 10-18zM9 14l13-11"/></svg><span>۹۸۰</span></div>

          <span class="ln h1"><span class="w" data-t="1.59">۸۰</span> <span class="w" data-t="1.75">هزار</span> <span class="w" data-t="1.95">ویو…</span></span>

        <div class="txt" id="s2-t4" style="top:200px">
          <span class="ln h2"><span class="w" data-t="9.86">چون</span> <span class="w" data-t="10.07">ویدیوش</span></span>

        <!-- Lights down, the trust ring -->
        <div class="s2-dim" id="s2-dim"></div>
        <div class="s2-ring" id="s2-ring">
          <svg viewBox="0 0 600 600">
            <defs><linearGradient id="s2-rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cc4ff" /><stop offset="1" stop-color="#0071e3" /></linearGradient></defs>
            <circle cx="300" cy="300" r="245" fill="none" stroke="#2c2c2e" stroke-width="70" />
            <circle id="s2-arc" cx="300" cy="300" r="245" fill="none" stroke="url(#s2-rg)" stroke-width="70" stroke-linecap="round"

          </svg>
          <div class="c" id="s2-ringlabel"><b>اعتماد</b><span id="s2-pct">۰٪</span></div>

        <div class="txt" id="s2-t5" style="top:200px">
          <span class="ln h1 on-dark"><span class="w" data-t="11.5">ولی</span> <span class="w" data-t="11.85">اعتماد</span></span>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s2"]');
          const q = (s) => root.querySelectorAll(s);
          const fa = (n) => Math.round(n).toLocaleString("fa-IR");

          q(".w[data-t]").forEach((el) => {
            tl.fromTo(el, { opacity: 0, y: 30, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, +el.dataset.t);
          });
          const out = (sel, t, d) => tl.to(sel, { opacity: 0, y: -44, filter: "blur(12px)", duration: d || 0.34, ease: "power2.in" }, t);

          // 1) Black screen = the bin's darkness. Screen wakes, camera pulls back to the phone.
          tl.fromTo("#s2-phonewrap", { scale: 3.7 }, { scale: 1, duration: 0.95, ease: "expo.out" }, 0.1);
          tl.to("#s2-scrblack", { opacity: 0, duration: 0.3, ease: "power1.out" }, 0.1);
          const views = { v: 0 };
          tl.fromTo(views, { v: 0 }, { v: 80000, duration: 1.0, ease: "power2.out",
            onUpdate: () => { document.getElementById("s2-views").textContent = fa(Math.round(views.v / 100) * 100); } }, 0.35);
          ["#s2-h1", "#s2-h2", "#s2-h3"].forEach((h, i) => {
            tl.fromTo(h, { opacity: 0, y: 0, x: 0, scale: 0.6 },
              { keyframes: [{ opacity: 1, scale: 1, duration: 0.15 }, { y: -330, x: -30 * (i + 1), opacity: 0, duration: 0.85, ease: "power1.out" }] }, 0.45 + i * 0.22);
          });
          out("#s2-t1", 1.32);

          // 2) Swipe inside the phone to the empty inbox; camera pushes in
          tl.to("#s2-reel", { x: -488, duration: 0.45, ease: "power3.inOut" }, 1.36);
          tl.fromTo("#s2-dm", { x: 488 }, { x: 0, duration: 0.45, ease: "power3.inOut" }, 1.36);
          tl.to("#s2-phonewrap", { scale: 1.12, y: 70, duration: 1.0, ease: "power2.inOut" }, 1.45);
          out("#s2-t2", 3.0);

          // 3) Pull back + arc: the client's reel, the 80,000 stat
          tl.to("#s2-dm", { x: 488, duration: 0.45, ease: "power3.inOut" }, 3.12);
          tl.to("#s2-reel", { x: 0, duration: 0.45, ease: "power3.inOut" }, 3.12);
          tl.to("#s2-phonewrap", { scale: 0.58, y: 470, rotationY: -24, rotationZ: -3, transformPerspective: 1600, duration: 1.1, ease: "power3.inOut" }, 3.08);
          tl.fromTo("#s2-chipwrap", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 4.62);
          q(".eq i").forEach((b, i) => {
            tl.fromTo(b, { scaleY: 0.3 }, { scaleY: 1, duration: 0.18 + i * 0.03, ease: "sine.inOut", yoyo: true, repeat: 15 }, 4.7 + i * 0.05);
          });
          tl.fromTo("#s2-stat", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.5);
          tl.fromTo("#s2-num", { scale: 0.9, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.5);
          const stat = { v: 0 };
          tl.fromTo(stat, { v: 0 }, { v: 80000, duration: 1.0, ease: "power3.out", immediateRender: false,
            onUpdate: () => { document.getElementById("s2-num").textContent = fa(Math.round(stat.v / 100) * 100); } }, 5.55);

          // 4) Dolly down: views leave the top, the lonely zero rises
          tl.to("#s2-world", { y: -1500, duration: 0.95, ease: "power3.inOut" }, 7.55);
          tl.to("#s2-phonewrap", { y: -260, opacity: 0, duration: 0.9, ease: "power3.inOut" }, 7.55);
          tl.fromTo("#s2-zero .zero", { scale: 0.85 }, { scale: 1, duration: 0.9, ease: "power3.out" }, 7.9);

          // 5) Parallax: the Veo card comes forward
          tl.to("#s2-zero", { opacity: 0, scale: 0.92, filter: "blur(10px)", duration: 0.55, ease: "power2.out" }, 9.5);
          tl.fromTo("#s2-card", { opacity: 0, y: 420, scale: 0.86 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "expo.out" }, 9.55);
          tl.fromTo("#s2-card video", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "none" }, 9.6);

          // 6) Lights down; the trust ring barely moves
          out("#s2-t4", 11.38, 0.3);
          tl.to("#s2-card", { y: -1150, scale: 0.92, rotation: -2, filter: "blur(6px)", duration: 0.5, ease: "power3.in" }, 11.48);
          tl.to("#s2-card", { opacity: 0, duration: 0.15, ease: "none" }, 11.83);
          tl.to("#s2-dim", { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 11.4);
          tl.fromTo("#s2-ring", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 11.85);
          const arcLen = 1539.4, pct = { v: 0 };
          tl.fromTo(pct, { v: 0 }, { immediateRender: false, keyframes: [{ v: 3, duration: 0.5, ease: "power2.out" }, { v: 5, duration: 0.2, ease: "sine.out" }, { v: 3, duration: 0.35, ease: "sine.inOut" }],
            onUpdate: () => {
              document.getElementById("s2-arc").setAttribute("stroke-dashoffset", (arcLen * (1 - pct.v / 100)).toFixed(1));
              document.getElementById("s2-pct").textContent = fa(Math.round(pct.v)) + "٪";
            } }, 12.0);

          // 7) Fly through the centre of the ring into black
          tl.to("#s2-t5", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 12.8);
          tl.to("#s2-ringlabel", { opacity: 0, scale: 1.4, duration: 0.22, ease: "power2.in" }, 12.8);
          tl.to("#s2-ring", { scale: 16, duration: 0.45, ease: "power3.in" }, 12.8);

          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
