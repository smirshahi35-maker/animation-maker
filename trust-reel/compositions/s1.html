<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: #1d1d1f; background: #f5f5f7; }
        .s1-bg { position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 40%, #ffffff 0%, #f5f5f7 55%, #e6e6eb 100%); }
        .s1-world { position: absolute; left: 0; top: 0; width: 1080px; height: 3400px; }
        .card { position: absolute; width: 300px; height: 400px; border-radius: 38px; background: #ffffff;
                box-shadow: 0 34px 70px rgba(0, 0, 0, 0.13), 0 3px 8px rgba(0, 0, 0, 0.06); }
        .vthumb { position: absolute; left: 22px; right: 22px; top: 22px; height: 236px; border-radius: 24px;
                  background: linear-gradient(160deg, #eef4ff, #d9e6ff); display: flex; align-items: center; justify-content: center; }
        .vplay { width: 118px; height: 118px; border-radius: 50%; background: #0071e3; display: flex; align-items: center; justify-content: center;
                 box-shadow: 0 14px 30px rgba(0, 113, 227, 0.35); }
        .vtri { width: 0; height: 0; margin-left: 10px; border-left: 40px solid #ffffff; border-top: 25px solid transparent; border-bottom: 25px solid transparent; }
        .vmeta { position: absolute; left: 30px; right: 30px; bottom: 34px; display: flex; justify-content: space-between; align-items: baseline; direction: ltr; }
        .vmeta b { font-size: 44px; font-weight: 800; letter-spacing: 0.01em; }
        .vmeta span { font-size: 30px; font-weight: 600; color: #86868b; }
        .inv { position: absolute; inset: 30px 30px 30px 30px; direction: rtl; display: flex; flex-direction: column; gap: 14px; }
        .inv h4 { margin: 0; font-size: 46px; font-weight: 900; line-height: 1.2; }
        .inv small { font-size: 22px; font-weight: 600; color: #86868b; margin-top: -10px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .row i { display: block; height: 12px; border-radius: 6px; background: #e8e8ed; }
        .inv .sum { margin-top: auto; border-top: 2px solid #e8e8ed; padding-top: 14px; font-size: 30px; font-weight: 800; }
        .s1-binwrap { position: absolute; left: 230px; top: 2230px; width: 620px; height: 890px; transform-origin: 50% 100%; }
        .s1-binwrap img { position: absolute; left: 0; top: 0; width: 620px; height: 890px; display: block; }
        .s1-floor { position: absolute; left: 160px; top: 3060px; width: 760px; height: 120px; border-radius: 50%;
                    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0)); }
        .s1-hole { position: absolute; left: 272px; top: 2400px; width: 530px; height: 172px; border-radius: 50%; background: #000; opacity: 0;
                   filter: blur(6px); }
        .s1-ballclip { position: absolute; left: 0; top: 0; width: 1080px; height: 2468px; overflow: hidden; }
        .ball { position: absolute; display: block; filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.18)); opacity: 0; }
        .txt { position: absolute; left: 96px; right: 96px; display: flex; flex-direction: column; align-items: center; direction: rtl; text-align: center; }
        .ln { display: block; white-space: nowrap; line-height: 1.34; }
        .w { display: inline-block; opacity: 0; }
        .h1 { font-size: 112px; font-weight: 850; letter-spacing: -0.01em; }
        .h2 { font-size: 60px; font-weight: 600; color: #6e6e73; }
        .h0 { font-size: 128px; font-weight: 900; letter-spacing: -0.015em; }
        .red { color: #ff3b30; }
        .s1-black { position: absolute; inset: 0; background: #000; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div class="s1-bg"></div>
        <div class="s1-world" id="s1-tilt">
          <div class="s1-world" id="s1-dive">
            <div class="s1-world" id="s1-push">
              <div id="s1-cards" style="position:absolute; left:0; top:0; width:1080px; height:2000px; transform:scale(1.3); transform-origin:540px 1040px">
              <div class="card" id="s1-vcard" style="left:230px; top:800px">
                <div class="vthumb"><div class="vplay"><div class="vtri"></div></div></div>
                <div class="vmeta"><b>MP4</b><span>02:14</span></div>
              </div>
              <div class="card" id="s1-icard" style="left:550px; top:880px">
                <div class="inv">
                  <h4>فاکتور</h4>
                  <small>تولید محتوا</small>
                  <div class="row"><i style="width:120px"></i><i style="width:60px"></i></div>
                  <div class="row"><i style="width:96px"></i><i style="width:70px"></i></div>
                  <div class="row"><i style="width:132px"></i><i style="width:52px"></i></div>
                  <div class="row"><i style="width:84px"></i><i style="width:66px"></i></div>
                  <div class="sum">۱۲٬۰۰۰٬۰۰۰ تومان</div>
                </div>
              </div>
              </div>
              <div class="s1-floor"></div>
              <div class="s1-binwrap" id="s1-bin"><img src="assets/ai/web/bin.png" alt="" /></div>
              <div class="s1-hole" id="s1-hole"></div>
              <div class="s1-ballclip">
                <img class="ball" id="s1-bv" src="assets/ai/web/ball-video.png" alt="" style="left:214px; top:864px; width:236px; height:248px" />
                <img class="ball" id="s1-bi" src="assets/ai/web/ball-invoice.png" alt="" style="left:631px; top:967px; width:234px; height:250px" />
              </div>
            </div>
          </div>
        </div>

        <div class="txt" id="s1-a" style="top:250px">
          <span class="ln h1"><span class="w" data-t="0.26">اگه</span> <span class="w" data-t="0.47">این</span> <span class="w" data-t="0.60">یه</span> <span class="w" data-t="0.73">نکته</span> <span class="w" data-t="1.08">رو</span></span>
          <span class="ln h1"><span class="w" data-t="1.25">نمی‌دونی…</span></span>
        </div>
        <div class="txt" id="s1-b" style="top:236px">
          <span class="ln h2"><span class="w" data-t="2.26">هرچی</span> <span class="w" data-t="2.67">تا</span> <span class="w" data-t="2.79">الان</span> <span class="w" data-t="3.13">واسه</span> <span class="w" data-t="3.46">تولید</span> <span class="w" data-t="3.84">محتوا</span></span>
        </div>
        <div class="txt" id="s1-c" style="top:340px">
          <span class="ln h0"><span class="w" data-t="4.33">خرج</span> <span class="w" data-t="4.66">کردی</span> <span class="w" data-t="4.94">رو</span></span>
          <span class="ln h0 red"><span class="w" data-t="5.07">بریز</span> <span class="w" data-t="5.42">دور.</span></span>
        </div>
        <div class="s1-black" id="s1-black"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const root = document.querySelector('[data-composition-id="s1"]');
          const q = (s) => root.querySelectorAll(s);

          // Words: soft blur + rise on their narration time
          q(".w[data-t]").forEach((el) => {
            tl.fromTo(el, { opacity: 0, y: 30, filter: "blur(10px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, +el.dataset.t);
          });
          tl.to("#s1-a", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, 1.9);
          tl.to("#s1-b", { opacity: 0.0, y: -30, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 4.05);
          tl.to("#s1-c", { opacity: 0, y: -50, filter: "blur(12px)", duration: 0.32, ease: "power2.in" }, 5.62);

          // Camera: slow push, then tilt down with the falling paper, then dive into the bin
          tl.fromTo("#s1-push", { scale: 1, transformOrigin: "540px 1040px" }, { scale: 1.05, duration: 3.4, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-tilt", { y: 0 }, { y: -1460, duration: 1.4, ease: "power3.inOut" }, 3.4);
          tl.fromTo("#s1-dive", { scale: 1, transformOrigin: "537px 2565px" }, { scale: 12, duration: 0.72, ease: "power3.in" }, 5.45);
          tl.to("#s1-hole", { opacity: 1, duration: 0.4, ease: "power1.in" }, 5.55);
          tl.to("#s1-black", { opacity: 1, duration: 0.2, ease: "none" }, 5.9);

          // Cards float before they are crumpled
          tl.fromTo("#s1-vcard", { rotation: -9, y: 0 }, { rotation: -6, y: -16, duration: 2.2, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-icard", { rotation: 7, y: 0 }, { rotation: 4, y: -12, duration: 2.6, ease: "sine.inOut" }, 0);

          // Crumple: card collapses, the GPT paper ball pops in its place
          function crumple(card, ball, t, spin) {
            tl.to(card, { scale: 0.42, rotation: spin, opacity: 0, filter: "blur(4px)", duration: 0.26, ease: "power3.in" }, t);
            tl.fromTo(ball, { opacity: 0, scale: 0.35, rotation: -spin },
              { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, t + 0.12);
          }
          crumple("#s1-vcard", "#s1-bv", 2.28, -40);
          crumple("#s1-icard", "#s1-bi", 2.72, 36);

          // Gravity: a small lift, then the fall into the bin opening
          tl.to("#s1-bv", { y: -36, duration: 0.3, ease: "power2.out" }, 2.95);
          tl.to("#s1-bv", { x: 138, y: 1720, rotation: 250, duration: 1.12, ease: "power2.in" }, 3.4);
          tl.to("#s1-bi", { y: -34, duration: 0.3, ease: "power2.out" }, 3.05);
          tl.to("#s1-bi", { x: -143, y: 1640, rotation: -230, duration: 1.08, ease: "power2.in" }, 3.36);

          // The bin answers each landing
          [4.36, 4.5].forEach((t, i) => {
            tl.fromTo("#s1-bin", { rotation: 0, scaleY: 1 },
              { keyframes: [{ rotation: i ? -1.1 : 1.4, scaleY: 0.985, duration: 0.08, ease: "power2.out" },
                            { rotation: 0, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }] }, t);
          });

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
